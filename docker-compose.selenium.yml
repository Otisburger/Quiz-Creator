version: '3.8'

services:
  frontend-test:
    environment:
      REACT_APP_BASEURL: 'http://127.0.0.1:5001'
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend-test
    networks:
      - app-network-test

  backend-test:
    environment:
      TEST: '1'
    build: ./
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      db-test:
        condition: service_healthy
    networks:
      - app-network-test

  db-test:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata-test:/var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    networks:
      - app-network-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-test:

networks:
  app-network-test:
    driver: bridge